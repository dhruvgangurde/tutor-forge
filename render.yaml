# Render blueprint for the TutorForge AI backend (F1).
# Deploys the FastAPI service from backend/ as a Docker web service, runs
# database migrations before each release, and health-checks /health.
#
# Secrets (marked sync:false) are set once in the Render dashboard and never
# committed. JWT_SECRET_KEY is generated by Render so it is strong and unique,
# satisfying the production boot guard (F6).
services:
  - type: web
    name: tutorforge-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    # Apply pending migrations before the new version starts taking traffic.
    preDeployCommand: alembic upgrade head
    envVars:
      - key: ENVIRONMENT
        value: production
      # Production must run on real Gemini. assert_safe_production_config()
      # refuses to boot on "mock" or "ollama" (the local-dev-only provider).
      - key: LLM_PROVIDER
        value: gemini
      - key: JWT_SECRET_KEY
        generateValue: true          # strong random secret (F6)
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "60"
      - key: DATABASE_URL
        fromDatabase:
          name: tutorforge-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_PRO_MODEL
        value: gemini-2.5-pro
      - key: GEMINI_FLASH_MODEL
        value: gemini-2.5-flash
      - key: EMBEDDING_MODEL
        value: text-embedding-004
      - key: CHROMA_PERSIST_PATH
        value: /app/data/chroma
      - key: CORS_ALLOWED_ORIGINS
        sync: false                  # set to the deployed frontend origin(s)
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        value: https://cloud.langfuse.com
    # A persistent disk keeps the Chroma vector store across deploys. (Externalizing
    # the vector store for multi-instance scale is tracked as F16 / Phase 3.)
    disk:
      name: chroma-data
      mountPath: /app/data
      sizeGB: 1

databases:
  - name: tutorforge-db
    plan: starter
    postgresMajorVersion: "16"

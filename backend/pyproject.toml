[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tutorforge-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
# NOTE (F14): version ranges carry an upper bound so a fresh resolve cannot
# silently pull a breaking major. requirements.lock.txt holds the exact,
# reproducible pin used to build the image — regenerate it with
# `pip freeze --exclude-editable > requirements.lock.txt` after any change here.
dependencies = [
    # Web framework
    "fastapi>=0.111.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "python-multipart>=0.0.9,<0.1",

    # Database
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "asyncpg>=0.29.0,<0.32",
    "alembic>=1.13.0,<2.0",

    # Settings & validation
    "pydantic-settings>=2.3.0,<3.0",
    "pydantic>=2.7.0,<3.0",
    "email-validator>=2.0.0,<3.0",  # required by auth.schemas.LoginRequest (EmailStr)

    # Auth
    "passlib[bcrypt]>=1.7.4,<2.0",
    # passlib 1.7.4 (the latest release) predates bcrypt 4.1+, which removed
    # the `__about__` attribute passlib probes for version detection and
    # (bcrypt 5.x) hard-raises instead of silently truncating on the classic
    # 72-byte limit. Both break password hashing/verification outright.
    # Pin until passlib ships a fix; safe to lift once it does.
    "bcrypt>=4.0,<4.1",
    "python-jose[cryptography]>=3.3.0,<4.0",

    # AI / LLM
    "google-generativeai>=0.7.0,<0.9",
    "langchain-google-genai>=1.0.0,<5.0",
    "langgraph>=0.2.0,<2.0",
    "langchain-core>=0.2.0,<2.0",

    # Observability
    "langfuse>=2.20.0,<5.0",

    # Vector store
    "chromadb>=0.5.0,<2.0",

    # File parsing
    "pdfplumber>=0.11.0,<0.12",
    "python-pptx>=1.0.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "eval"]

[tool.ruff]
line-length = 100
target-version = "py312"
